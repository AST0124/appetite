<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APPETITE</title>
<style>
  @font-face {
    font-family: "Alike";
    src: url("fonts/alike.woff2") format("woff2"),
         url("https://fontsapi.zeoseven.com/fv/main.woff2") format("woff2");
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #e8e6e1;
    font-family: "Courier New", Courier, monospace;
    color: #111;
    user-select: none;
  }

  /* living dithered background */
  #bgCanvas {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    image-rendering: pixelated;
    z-index: 0;
  }

  /* ------- old-machine windows ------- */
  .win {
    position: fixed;
    background: #e8e6e1;
    border: 1.5px solid #111;
    box-shadow: 3px 3px 0 rgba(17,17,17,0.4);
    z-index: 10;
  }
  .win .bar {
    position: relative;
    height: 22px;
    border-bottom: 1.5px solid #111;
    background: repeating-linear-gradient(180deg,
      #e8e6e1 0 2px, #8f8c84 2px 3px, #e8e6e1 3px 5px);
    display: flex; align-items: center;
    padding: 0 6px;
    cursor: grab;
  }
  .win .bar:active { cursor: grabbing; }
  .bar .btn {
    width: 11px; height: 11px;
    border: 1.5px solid #111;
    background: #e8e6e1;
    margin-right: 6px;
    flex: 0 0 auto;
  }
  .bar .title {
    font-size: 11px; letter-spacing: 2px;
    background: #e8e6e1;
    padding: 0 8px;
    margin: 0 auto;
    white-space: nowrap;
  }
  .win .body { padding: 22px 26px; }

  /* the falling stage: hand + menu ride in together */
  #drop {
    position: fixed; inset: 0;
    pointer-events: none;
    transform: translateY(-125vh);
    transition: transform 1.5s cubic-bezier(0.22, 0.85, 0.35, 1);
    z-index: 20;
  }
  #drop.in { transform: translateY(0); }
  #drop > * { pointer-events: auto; }

  #hand {
    position: absolute;
    left: 56%;
    top: calc(46vh - 660px);
    width: 190px;
    pointer-events: none;
    transition: transform 1.1s cubic-bezier(0.55, 0, 0.8, 0.4);
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
    z-index: 30;
    image-rendering: pixelated;
  }
  #hand.retreat { transform: translateY(-125vh); }

  /* menu window */
  #mainWin {
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: min(560px, 86vw);
  }
  /* the menu card: paper inside a machine window */
  #mainWin .body {
    margin: 8px;
    border: 1px solid #26221c;
    outline: 1px solid #26221c;
    outline-offset: 3px;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.55), transparent 65%),
      repeating-linear-gradient(93deg, rgba(120,105,80,0.05) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(2deg, rgba(120,105,80,0.04) 0 3px, transparent 3px 7px),
      #f3efe4;
    box-shadow: inset 0 0 40px rgba(120, 100, 60, 0.13);
  }
  .menuLabel {
    font-family: "Alike", Georgia, serif;
    text-align: center;
    font-size: 11px;
    letter-spacing: 8px;
    color: #6b6353;
    margin-bottom: 10px;
  }
  #mainWin h1 {
    font-family: "Alike", Georgia, serif;
    font-size: clamp(30px, 5.4vw, 54px);
    font-weight: normal;
    letter-spacing: 0.14em;
    text-align: center;
    margin: 14px 0 24px;
    color: #17140f;
    transform: scaleY(1.3);
    transform-origin: 50% 50%;
    text-shadow: 1.5px 0 0 rgba(150, 32, 28, 0.5), -1.5px 0 0 rgba(60, 90, 140, 0.45);
  }
  #log {
    font-size: 11px;
    letter-spacing: 1px;
    color: #444;
    line-height: 2;
    min-height: 44px;
    margin-bottom: 18px;
  }
  #log .cursor {
    display: inline-block;
    width: 7px; height: 12px;
    background: #111;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #enterBtn {
    display: block;
    margin: 0 auto;
    font-family: inherit;
    font-size: 12px; letter-spacing: 3px;
    padding: 9px 26px;
    color: #111;
    background: #e8e6e1;
    border: 1.5px solid #111;
    box-shadow: inset 2px 2px 0 #fbfaf7, inset -2px -2px 0 #b3afa5;
    cursor: pointer;
  }
  #enterBtn:active {
    box-shadow: inset -2px -2px 0 #fbfaf7, inset 2px 2px 0 #b3afa5;
    transform: translate(1px, 1px);
  }

  /* photo window: a photo slipped underneath the menu card */
  #photoWin {
    width: 280px;
    left: 50%; top: calc(46vh + 40px);
    transform: translateX(-78%);
    z-index: 5;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #photoWin.show { opacity: 1; }
  #photoWin .body { padding: 10px; }
  #photoWin img {
    display: block; width: 100%;
    filter: saturate(0.9) contrast(1.02);
  }

  /* hover preview: a photo peeks out beside the cursor */
  #hoverPreview {
    position: fixed;
    width: 150px;
    padding: 6px 6px 16px;
    background: #f4f2ed;
    border: 1px solid #111;
    box-shadow: 3px 4px 0 rgba(17,17,17,0.3);
    transform: rotate(-5deg) translateY(10px);
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
    z-index: 90;
  }
  #hoverPreview.on {
    opacity: 0.88;
    visibility: visible;
    transform: rotate(-5deg) translateY(0);
  }
  #hoverPreview img { display: block; width: 100%; }

  /* tune window: real dials, bottom right */
  #tuneWin {
    right: 18px; bottom: 44px; left: auto; top: auto;
    width: 230px;
    z-index: 60;
  }
  #tuneWin .body { padding: 12px 14px; }
  #tuneWin .dial {
    display: grid;
    grid-template-columns: 52px 1fr 26px;
    align-items: center; gap: 7px;
    margin-bottom: 7px;
  }
  #tuneWin .dial:last-child { margin-bottom: 0; }
  #tuneWin label { font-size: 10px; letter-spacing: 1px; color: #555; }
  #tuneWin input[type="range"] { width: 100%; accent-color: #111; }
  #tuneWin .val { font-size: 10px; color: #555; text-align: right; }
  #tuneWin .stepper {
    grid-column: 2 / 4;
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    font-size: 11px;
  }
  #tuneWin .stepper button {
    font-family: inherit; font-size: 10px;
    border: 1px solid #111; background: #e8e6e1;
    width: 22px; height: 18px; cursor: pointer;
  }
  #tuneWin.folded .body { display: none; }
  /* the dials are Elisa's, not the visitors': press E to reveal */
  #tuneWin { display: none; }
  body.tune-open #tuneWin { display: block; }

  #status {
    position: fixed; left: 0; bottom: 0; width: 100%;
    border-top: 1.5px solid #111;
    background: #e8e6e1;
    font-size: 10px; letter-spacing: 1.5px; color: #555;
    padding: 5px 12px;
    display: flex; justify-content: space-between;
    z-index: 50;
  }
</style>
</head>
<body>
<script src="transition.js"></script>
<script src="sound.js"></script>

<canvas id="bgCanvas"></canvas>

<div class="win" id="photoWin">
  <div class="bar"><div class="btn"></div><div class="title" id="photoTitle"></div><div class="btn"></div></div>
  <div class="body"><img id="photoImg" alt=""></div>
</div>

<div id="drop">
  <img id="hand" alt="">
  <div class="win" id="mainWin">
    <div class="bar"><div class="btn"></div><div class="title">menu.exe</div><div class="btn"></div></div>
    <div class="body">
      <div class="menuLabel">M E N U</div>
      <h1>APPETITE</h1>
      <div id="log"></div>
      <button id="enterBtn" data-preview="img/web/image-21.jpg">come in</button>
    </div>
  </div>
</div>

<div id="hoverPreview"><img alt=""></div>

<div class="win" id="tuneWin">
  <div class="bar"><div class="btn"></div><div class="title">tune.cpl</div><div class="btn"></div></div>
  <div class="body" id="tuneBody">
    <div class="dial"><label>photo</label>
      <span class="stepper"><button id="bgPrev">◀</button><span id="bgNum"></span><button id="bgNext">▶</button></span>
    </div>
    <div class="dial"><label>grain</label><input type="range" id="tPixel" min="3" max="12" step="1"><span class="val"></span></div>
    <div class="dial"><label>tones</label><input type="range" id="tLevels" min="3" max="8" step="1"><span class="val"></span></div>
    <div class="dial"><label>fade</label><input type="range" id="tFade" min="0" max="50" step="1"><span class="val"></span></div>
    <div class="dial"><label>drift</label><input type="range" id="tWobble" min="0" max="40" step="1"><span class="val"></span></div>
  </div>
</div>

<div id="status">
  <span id="statusLeft">// APPETITE · elisa xu · 2026</span>
  <span id="clock"></span>
</div>

<script>
/* ============ EDIT ZONE ============ */
/* 词源开场（Elisa 选定方向；措辞可随时改） */
const INTRO_LINES = [
  "// appetitus. Latin, noun.",
  "// 1. an attack, an assault",
  "// 2. passionate desire; a longing"
];
const WINDOW_PHOTO = 83;        // 小窗口里的照片编号
const HAND_IMG = 'elements/hand-cut.jpg';
/* 开屏背景每次从这个池子里随机挑一张 */
const BG_POOL = [21, 26, 33, 57, 62];
/* 下面这些现在都有页面右下角 tune 窗口里的滑杆，不用改代码
   （默认值 = Elisa 2026-08-17 深夜圈定的那组） */
let BG_PHOTO = BG_POOL[Math.floor(Math.random() * BG_POOL.length)];
let BG_PIXEL = 4;               // 背景颗粒在屏幕上的大小(px)，越大越粗
let BG_LEVELS = 8;              // 每个色彩通道保留几档，越少越复古
let BG_FADE = 0.14;             // 背景向纸色褪多少 (0-1)
let BG_WOBBLE = 0.6;            // 背景波动幅度
/* ==================================== */

/* ------- colored dithered living background ------- */
const BAYER = [ [0,8,2,10], [12,4,14,6], [3,11,1,9], [15,7,13,5] ];
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let bgTile = null;   // {data, w, h}
let mouseX = -999, mouseY = -999, easeX = -999, easeY = -999;
window.addEventListener('pointermove', e => { mouseX = e.clientX; mouseY = e.clientY; });

let rawBg = null;
function buildTile() {
  if (!rawBg) return;
  const w = 190;
  const h = Math.round(w * rawBg.naturalHeight / rawBg.naturalWidth);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(rawBg, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h);
  const paper = [232, 230, 225];
  // keep the tile smooth here; the dither pattern is applied at screen
  // coordinates every frame, so the grain stays still while the image drifts
  for (let i = 0; i < d.data.length; i += 4) {
    for (let ch = 0; ch < 3; ch++) {
      d.data[i + ch] = d.data[i + ch] * (1 - BG_FADE) + paper[ch] * BG_FADE;
    }
  }
  bgTile = { data: d.data, w, h };
}
function loadBgPhoto() {
  const im = new Image();
  im.onload = () => { rawBg = im; buildTile(); };
  im.src = `img/web/image-${BG_PHOTO}.jpg`;
}

let bgOut = null;
function sizeBg() {
  bgCanvas.width = Math.ceil(window.innerWidth / BG_PIXEL);
  bgCanvas.height = Math.ceil(window.innerHeight / BG_PIXEL);
  bgOut = bgCtx.createImageData(bgCanvas.width, bgCanvas.height);
}
sizeBg();
window.addEventListener('resize', sizeBg);

function bgLoop() {
  if (bgTile && bgOut) {
    easeX += (mouseX - easeX) * 0.06;
    easeY += (mouseY - easeY) * 0.06;
    const t = performance.now() / 1000;
    const {data, w, h} = bgTile;
    const W = bgCanvas.width, H = bgCanvas.height;
    const mcx = easeX / BG_PIXEL, mcy = easeY / BG_PIXEL;
    const R = 26;
    const o = bgOut.data;
    const L = BG_LEVELS - 1;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        // slow, large-scale drift so neighbouring cells move together
        let dx = Math.sin(x * 0.06 + t * 0.5 + y * 0.045) * BG_WOBBLE;
        let dy = Math.cos(x * 0.05 - t * 0.4 + y * 0.07) * BG_WOBBLE;
        const ddx = x - mcx, ddy = y - mcy;
        const dist = Math.sqrt(ddx*ddx + ddy*ddy);
        if (dist < R && dist > 0.01) {
          const push = (1 - dist / R) * 2.4;
          dx += ddx / dist * push;
          dy += ddy / dist * push;
        }
        const sx = ((Math.round(x + dx) % w) + w) % w;
        const sy = ((Math.round(y + dy) % h) + h) % h;
        const si = (sy * w + sx) * 4;
        const oi = (y * W + x) * 4;
        // screen-fixed ordered dither
        const bt = (BAYER[y % 4][x % 4] + 0.5) / 16 - 0.5;
        for (let ch = 0; ch < 3; ch++) {
          let q = Math.round(data[si + ch] / 255 * L + bt);
          q = q < 0 ? 0 : (q > L ? L : q);
          o[oi + ch] = q / L * 255;
        }
        o[oi + 3] = 255;
      }
    }
    bgCtx.putImageData(bgOut, 0, 0);
  }
  requestAnimationFrame(bgLoop);
}
requestAnimationFrame(bgLoop);

/* ------- hand: knock out the black backdrop at load ------- */
const handImg = new Image();
handImg.onload = () => {
  // low resolution + the same dither treatment as the background,
  // so the photographic hand belongs to the machine world
  const c = document.createElement('canvas');
  const w = 64, h = Math.round(w * handImg.naturalHeight / handImg.naturalWidth);
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(handImg, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h);
  const L = 5;
  for (let yy = 0; yy < h; yy++) {
    for (let xx = 0; xx < w; xx++) {
      const i = (yy * w + xx) * 4;
      const lum = d.data[i]*0.299 + d.data[i+1]*0.587 + d.data[i+2]*0.114;
      d.data[i+3] = Math.max(0, Math.min(255, (lum - 16) * 10));
      const bt = (BAYER[yy % 4][xx % 4] + 0.5) / 16 - 0.5;
      for (let ch = 0; ch < 3; ch++) {
        const desat = d.data[i + ch] * 0.68 + lum * 0.32;   // pull toward gray a touch
        let q = Math.round(desat / 255 * (L - 1) + bt);
        q = q < 0 ? 0 : (q > L - 1 ? L - 1 : q);
        d.data[i + ch] = q / (L - 1) * 255;
      }
    }
  }
  x.putImageData(d, 0, 0);
  document.getElementById('hand').src = c.toDataURL();
  startEntrance();
};
handImg.src = HAND_IMG;

/* ------- entrance: the hand pushes the menu down onto the desk ------- */
function startEntrance() {
  setTimeout(() => {
    document.getElementById('drop').classList.add('in');
  }, 350);
  setTimeout(() => {
    document.getElementById('hand').classList.add('retreat');
    type();
  }, 2000);
  setTimeout(() => {
    document.getElementById('photoWin').classList.add('show');
  }, 2700);
}

/* ------- photo window ------- */
document.getElementById('photoImg').src = `img/web/image-${WINDOW_PHOTO}.jpg`;
document.getElementById('photoTitle').textContent = `img_${String(WINDOW_PHOTO).padStart(3,'0')}.jpg`;

/* ------- boot log typing ------- */
const log = document.getElementById('log');
let li = 0, ci = 0, typed = '';
function type() {
  if (li >= INTRO_LINES.length) {
    log.innerHTML = typed + '<span class="cursor"></span>';
    return;
  }
  const line = INTRO_LINES[li];
  if (ci < line.length) {
    ci++;
    window.sfx && sfx.type();
    log.innerHTML = typed + line.slice(0, ci) + '<span class="cursor"></span>';
    setTimeout(type, 26);
  } else {
    typed += line + '<br>';
    li++; ci = 0;
    setTimeout(type, 320);
  }
}

/* ------- clock ------- */
const clock = document.getElementById('clock');
setInterval(() => { clock.textContent = new Date().toTimeString().slice(0, 8); }, 1000);

/* ------- hover preview beside the cursor ------- */
const hp = document.getElementById('hoverPreview');
const hpImg = hp.querySelector('img');
document.querySelectorAll('[data-preview]').forEach(el => {
  el.addEventListener('mouseenter', e => {
    hpImg.src = el.dataset.preview;
    hp.style.left = (e.clientX + 18) + 'px';
    hp.style.top = (e.clientY - 60) + 'px';
    hp.classList.add('on');
  });
  el.addEventListener('mousemove', e => {
    hp.style.left = (e.clientX + 18) + 'px';
    hp.style.top = (e.clientY - 60) + 'px';
  });
  el.addEventListener('mouseleave', () => { hp.classList.remove('on'); });
});

/* ------- tune window: dials for the background ------- */
const MISSING = [12, 16, 63, 73];
const PHOTO_NUMS = Array.from({length: 92}, (_, i) => i + 1).filter(n => !MISSING.includes(n));

(function initTune() {
  try {
    const saved = JSON.parse(localStorage.getItem('appetite-v2-enter-tune'));
    if (saved) {
      // photo is deliberately NOT restored — each visit opens on a random one
      BG_PIXEL = saved.pixel ?? BG_PIXEL;
      BG_LEVELS = saved.levels ?? BG_LEVELS;
      BG_FADE = saved.fade ?? BG_FADE;
      BG_WOBBLE = saved.wobble ?? BG_WOBBLE;
    }
  } catch (e) {}

  const els = {
    pixel: document.getElementById('tPixel'),
    levels: document.getElementById('tLevels'),
    fade: document.getElementById('tFade'),
    wobble: document.getElementById('tWobble')
  };
  els.pixel.value = BG_PIXEL;
  els.levels.value = BG_LEVELS;
  els.fade.value = Math.round(BG_FADE * 100);
  els.wobble.value = Math.round(BG_WOBBLE * 10);
  document.getElementById('bgNum').textContent = BG_PHOTO;

  function refreshVals() {
    document.querySelectorAll('#tuneWin .dial').forEach(d => {
      const inp = d.querySelector('input');
      if (inp) d.querySelector('.val').textContent = inp.value;
    });
  }
  refreshVals();

  function saveTune() {
    localStorage.setItem('appetite-v2-enter-tune', JSON.stringify({
      photo: BG_PHOTO, pixel: BG_PIXEL, levels: BG_LEVELS, fade: BG_FADE, wobble: BG_WOBBLE
    }));
  }

  els.pixel.addEventListener('input', () => { BG_PIXEL = +els.pixel.value; sizeBg(); refreshVals(); saveTune(); });
  els.levels.addEventListener('input', () => { BG_LEVELS = +els.levels.value; refreshVals(); saveTune(); });
  els.fade.addEventListener('input', () => { BG_FADE = +els.fade.value / 100; buildTile(); refreshVals(); saveTune(); });
  els.wobble.addEventListener('input', () => { BG_WOBBLE = +els.wobble.value / 10; refreshVals(); saveTune(); });

  function stepPhoto(dir) {
    const i = PHOTO_NUMS.indexOf(BG_PHOTO);
    BG_PHOTO = PHOTO_NUMS[(i + dir + PHOTO_NUMS.length) % PHOTO_NUMS.length];
    document.getElementById('bgNum').textContent = BG_PHOTO;
    loadBgPhoto();
    saveTune();
  }
  document.getElementById('bgPrev').addEventListener('click', () => stepPhoto(-1));
  document.getElementById('bgNext').addEventListener('click', () => stepPhoto(1));

  // double-click the title bar to fold the dials away
  document.querySelector('#tuneWin .bar').addEventListener('dblclick', () => {
    document.getElementById('tuneWin').classList.toggle('folded');
  });

  loadBgPhoto();
})();

/* ------- draggable windows ------- */
document.querySelectorAll('.win').forEach(win => {
  const bar = win.querySelector('.bar');
  let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
  bar.addEventListener('pointerdown', e => {
    dragging = true;
    const r = win.getBoundingClientRect();
    win.style.left = r.left + 'px';
    win.style.top = r.top + 'px';
    win.style.transform = 'none';
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    bar.setPointerCapture(e.pointerId);
    document.querySelectorAll('.win').forEach(w => w.style.zIndex = 10);
    win.style.zIndex = 20;
  });
  bar.addEventListener('pointermove', e => {
    if (!dragging) return;
    win.style.left = (ox + e.clientX - sx) + 'px';
    win.style.top = (oy + e.clientY - sy) + 'px';
  });
  bar.addEventListener('pointerup', () => { dragging = false; });
});

document.getElementById('enterBtn').addEventListener('click', () => {
  (window.fadeGo || (u => window.location.href = u))('dialog.html');
});

window.addEventListener('keydown', e => {
  if (e.key === 'e' || e.key === 'E') document.body.classList.toggle('tune-open');
});
</script>
</body>
</html>
